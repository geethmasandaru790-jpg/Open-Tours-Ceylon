<!-- frontend: floating AI chatbot widget — append before </body> in index.html -->
<button id="chatFab" aria-label="Chat with us" class="fixed bottom-5 right-5 z-[70] w-14 h-14 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-900 shadow-xl shadow-amber-500/30 flex items-center justify-center text-2xl">
  <i class="fa-solid fa-comment-dots"></i>
</button>
<div id="chatPanel" class="fixed bottom-24 right-5 z-[70] hidden w-[92vw] max-w-sm h-[70vh] max-h-[520px] bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
  <div class="flex items-center justify-between px-4 py-3 bg-slate-900 border-b border-slate-700">
    <span class="text-white font-semibold text-sm"><i class="fa-solid fa-robot text-amber-400 mr-2"></i>Open Tours Assistant</span>
    <button id="chatClose" class="text-slate-400 hover:text-white" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div id="chatMsgs" class="flex-1 overflow-y-auto p-3 space-y-2 text-sm"></div>
  <form id="chatForm" class="flex gap-2 p-3 border-t border-slate-700">
    <input id="chatInput" class="field flex-1" placeholder="Ask about tours, prices, drivers..." autocomplete="off">
    <button class="px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button>
  </form>
</div>
<script>
(function () {
  const API_BASE = window.OTC_API_BASE || 'http://localhost:4000/api';
  const sessionId = (() => {
    let id = sessionStorage.getItem('otc_chat_sid');
    if (!id) { id = crypto.randomUUID(); sessionStorage.setItem('otc_chat_sid', id); }
    return id;
  })();
  const fab = document.getElementById('chatFab'), panel = document.getElementById('chatPanel'),
        msgs = document.getElementById('chatMsgs'), form = document.getElementById('chatForm'), input = document.getElementById('chatInput');

  fab.onclick = () => panel.classList.toggle('hidden');
  document.getElementById('chatClose').onclick = () => panel.classList.add('hidden');

  function addMsg(role, text) {
    const row = document.createElement('div');
    row.className = role === 'user' ? 'text-right' : 'text-left';
    row.innerHTML = `<span class="inline-block px-3 py-2 rounded-xl ${role === 'user' ? 'bg-amber-500 text-slate-900' : 'bg-slate-700 text-slate-100'}">${String(text).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</span>`;
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMsg('user', text);
    input.value = '';
    try {
      const token = localStorage.getItem('otc_token');
      const res = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
        body: JSON.stringify({ message: text, sessionId }),
      });
      const data = await res.json();
      addMsg('assistant', data.reply || "Sorry, I couldn't get a response.");
    } catch (_) {
      addMsg('assistant', "I'm having trouble connecting right now. Please try again shortly.");
    }
  });
})();
</script>
