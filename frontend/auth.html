<!-- ============================================================
     FRONTEND INTEGRATION #1 — Real Auth + Verification Gate
     Insert into your existing index.html:
     - Replace the existing #m-auth modal markup with the version below
     - Add the new #m-otp modal markup right after it
     - Replace the old fake "social sign-in" script block with the
       script block below (keeps all existing styling/classes)
     ============================================================ -->

<!-- AUTH MODAL (replaces old social-only version) -->
<div id="m-auth" class="ov"><div class="box max-w-md">
  <div class="flex justify-between items-center mb-3">
    <h3 class="text-xl font-bold text-white" id="authTitle">Sign In</h3>
    <button data-close class="w-9 h-9 rounded-full hover:bg-slate-700" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <div class="flex gap-2 mb-4">
    <button id="authTabLogin" type="button" class="flex-1 py-2 rounded-xl border border-amber-400 text-amber-400 text-sm font-semibold">Sign In</button>
    <button id="authTabRegister" type="button" class="flex-1 py-2 rounded-xl border border-slate-600 text-slate-300 text-sm font-semibold">Register</button>
  </div>

  <p id="authErr" class="hidden mb-3 text-sm text-red-400"></p>

  <form id="loginForm" class="grid gap-3">
    <input id="loginEmail" type="email" class="field" placeholder="Email" required>
    <input id="loginPassword" type="password" class="field" placeholder="Password" required>
    <button class="py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold">Sign In</button>
  </form>

  <form id="registerForm" class="hidden grid gap-3">
    <input id="regName" class="field" placeholder="Full name" required maxlength="60">
    <input id="regEmail" type="email" class="field" placeholder="Email" required>
    <input id="regPhone" type="tel" class="field" placeholder="Phone (+94 77 123 4567)" required>
    <input id="regPassword" type="password" class="field" placeholder="Password (min 6 chars)" required minlength="6">
    <div>
      <label class="lbl">I am a...</label>
      <div class="grid grid-cols-3 gap-2" id="roleSelect">
        <button type="button" data-role="tourist" class="role-btn py-2 rounded-xl border border-amber-400 text-amber-400 text-xs font-semibold">Tourist</button>
        <button type="button" data-role="driver" class="role-btn py-2 rounded-xl border border-slate-600 text-slate-300 text-xs font-semibold">Driver</button>
        <button type="button" data-role="guide" class="role-btn py-2 rounded-xl border border-slate-600 text-slate-300 text-xs font-semibold">Guide</button>
      </div>
    </div>
    <button class="py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold">Create Account</button>
  </form>

  <div id="authIn" class="hidden text-sm">
    <div class="flex items-center justify-between mb-3">
      <p id="who" class="text-amber-400 font-semibold"></p>
      <span id="verBadge" class="vpill"></span>
    </div>
    <button id="out" class="px-4 py-2 rounded-lg border border-slate-600 hover:border-amber-400 hover:text-amber-400">Sign out</button>
  </div>
</div></div>

<!-- OTP VERIFICATION MODAL -->
<div id="m-otp" class="ov"><div class="box max-w-sm">
  <div class="flex justify-between items-center mb-3">
    <h3 class="text-xl font-bold text-white"><i class="fa-solid fa-shield-halved text-amber-400 mr-2"></i>Verify Your Account</h3>
    <button data-close class="w-9 h-9 rounded-full hover:bg-slate-700" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <p class="text-sm text-slate-400 mb-4">Please verify your email or phone number first to create listings.</p>
  <div class="flex gap-2 mb-4">
    <button id="otpSendEmail" type="button" class="flex-1 py-2.5 rounded-xl border border-slate-600 hover:border-amber-400 hover:text-amber-400 text-sm font-semibold"><i class="fa-solid fa-envelope mr-1"></i>Email</button>
    <button id="otpSendPhone" type="button" class="flex-1 py-2.5 rounded-xl border border-slate-600 hover:border-amber-400 hover:text-amber-400 text-sm font-semibold"><i class="fa-solid fa-sms mr-1"></i>SMS</button>
  </div>
  <p id="otpHint" class="hidden text-xs text-amber-300 mb-3"></p>
  <p id="otpErr" class="hidden text-sm text-red-400 mb-2"></p>
  <form id="otpForm" class="grid gap-3">
    <input id="otpCode" class="field" placeholder="6-digit code" maxlength="6" autocomplete="off">
    <button class="py-3 rounded-xl bg-green-600 hover:bg-green-500 text-white font-semibold">Verify</button>
  </form>
</div></div>

<script>
/* ================= Real auth + verification gate =================
   Requires the backend from earlier (auth/otp/ads routes).
   Set OTC_API_BASE to your deployed API origin, e.g.
   window.OTC_API_BASE = 'https://api.opentoursceylon.com/api';
================================================================== */
const OTC_API = window.OTC_API_BASE || 'http://localhost:4000/api';

const authStore = {
  get token() { return localStorage.getItem('otc_token'); },
  set token(v) { v ? localStorage.setItem('otc_token', v) : localStorage.removeItem('otc_token'); },
};
let authUser = null;
let pendingAfterVerify = null;

async function otcApi(path, { method = 'GET', body, auth = true } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && authStore.token) headers.Authorization = `Bearer ${authStore.token}`;
  const res = await fetch(`${OTC_API}${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || `Request failed (${res.status})`); err.code = data.code; throw err; }
  return data;
}

function setAuthErr(msg) {
  const el = $('authErr');
  if (!msg) { el.classList.add('hidden'); return; }
  el.textContent = msg; el.classList.remove('hidden');
}
function setOtpErr(msg) {
  const el = $('otpErr');
  if (!msg) { el.classList.add('hidden'); return; }
  el.textContent = msg; el.classList.remove('hidden');
}

function switchAuthTab(which) {
  $('loginForm').classList.toggle('hidden', which !== 'login');
  $('registerForm').classList.toggle('hidden', which !== 'register');
  $('authTitle').textContent = which === 'login' ? 'Sign In' : 'Create Your Account';
  $('authTabLogin').className = 'flex-1 py-2 rounded-xl border text-sm font-semibold ' + (which === 'login' ? 'border-amber-400 text-amber-400' : 'border-slate-600 text-slate-300');
  $('authTabRegister').className = 'flex-1 py-2 rounded-xl border text-sm font-semibold ' + (which === 'register' ? 'border-amber-400 text-amber-400' : 'border-slate-600 text-slate-300');
  setAuthErr('');
}
$('authTabLogin').onclick = () => switchAuthTab('login');
$('authTabRegister').onclick = () => switchAuthTab('register');

let selectedRole = 'tourist';
document.querySelectorAll('.role-btn').forEach(b => b.onclick = () => {
  selectedRole = b.dataset.role;
  document.querySelectorAll('.role-btn').forEach(x => x.className = 'role-btn py-2 rounded-xl border border-slate-600 text-slate-300 text-xs font-semibold');
  b.className = 'role-btn py-2 rounded-xl border border-amber-400 text-amber-400 text-xs font-semibold';
});

function renderAuthPanel() {
  const loggedIn = !!authUser;
  $('loginForm').classList.toggle('hidden', loggedIn || $('registerForm').classList.contains('hidden') === false && false);
  $('authIn').classList.toggle('hidden', !loggedIn);
  if (loggedIn) {
    $('loginForm').classList.add('hidden');
    $('registerForm').classList.add('hidden');
    document.querySelector('#m-auth .flex.gap-2.mb-4').classList.add('hidden');
    $('who').textContent = `${authUser.name} (${authUser.role})`;
    $('verBadge').outerHTML = authUser.isAccountVerified
      ? `<span id="verBadge" class="vpill bg-emerald-500/15 text-emerald-300 border border-emerald-500/40"><i class="fa-solid fa-circle-check mr-1"></i>Verified</span>`
      : `<span id="verBadge" class="vpill bg-amber-500/15 text-amber-300 border border-amber-500/40"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Unverified</span>`;
  } else {
    document.querySelector('#m-auth .flex.gap-2.mb-4').classList.remove('hidden');
    switchAuthTab('login');
  }
}

async function loadMe() {
  if (!authStore.token) { authUser = null; return; }
  try { const { user } = await otcApi('/auth/me'); authUser = user; }
  catch (_) { authStore.token = null; authUser = null; }
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); setAuthErr('');
  try {
    const data = await otcApi('/auth/login', { auth: false, method: 'POST', body: {
      email: $('loginEmail').value, password: $('loginPassword').value,
    }});
    authStore.token = data.token; authUser = data.user;
    renderAuthPanel();
    if (pendingAfterVerify && authUser.isAccountVerified) { const fn = pendingAfterVerify; pendingAfterVerify = null; fn(); }
    else if (pendingAfterVerify) openModal('m-otp');
    else close('m-auth');
  } catch (err) { setAuthErr(err.message); }
});

$('registerForm').addEventListener('submit', async e => {
  e.preventDefault(); setAuthErr('');
  try {
    const data = await otcApi('/auth/register', { auth: false, method: 'POST', body: {
      name: $('regName').value, email: $('regEmail').value, phone: $('regPhone').value,
      password: $('regPassword').value, role: selectedRole,
    }});
    authStore.token = data.token; authUser = data.user;
    renderAuthPanel();
    toast('Account created. Verify your account to post listings.');
    if (pendingAfterVerify) openModal('m-otp'); else close('m-auth');
  } catch (err) { setAuthErr(err.message); }
});

$('out').onclick = () => { authStore.token = null; authUser = null; renderAuthPanel(); toast('Signed out.'); };

/* Reuse existing modal open()/close() helpers already defined in your site's script */
function openModal(id) { open(id); if (id === 'm-auth') renderAuthPanel(); }

/* ---------------- OTP flow ---------------- */
$('otpSendEmail').onclick = () => sendOtp('email');
$('otpSendPhone').onclick = () => sendOtp('phone');
async function sendOtp(channel) {
  setOtpErr('');
  try {
    const res = await otcApi('/otp/send', { method: 'POST', body: { channel } });
    const hint = $('otpHint');
    hint.classList.remove('hidden');
    hint.textContent = res.devMode
      ? `Dev mode: check the backend server console for your ${channel} code.`
      : `Code sent via ${channel}. It expires in 10 minutes.`;
  } catch (err) { setOtpErr(err.message); }
}
$('otpForm').addEventListener('submit', async e => {
  e.preventDefault(); setOtpErr('');
  try {
    await otcApi('/otp/verify', { method: 'POST', body: { code: $('otpCode').value } });
    await loadMe();
    close('m-otp');
    toast('Account verified!');
    renderAuthPanel();
    if (pendingAfterVerify) { const fn = pendingAfterVerify; pendingAfterVerify = null; fn(); }
  } catch (err) { setOtpErr(err.message); }
});

/* ---------------- Verification gate wrapper ---------------- */
function requireVerifiedThen(action) {
  if (!authUser) { pendingAfterVerify = action; openModal('m-auth'); return; }
  if (authUser.isAccountVerified) { action(); return; }
  pendingAfterVerify = action;
  setOtpErr(''); $('otpHint').classList.add('hidden');
  openModal('m-otp');
}

/* ---------------- Gate the existing "List Your Tour" flow ----------------
   Wrap the button(s) that open #m-list so they check verification first,
   and post the real payload to the backend on submit instead of only WhatsApp. */
document.querySelectorAll('[data-open="m-list"]').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopImmediatePropagation(); // stop the generic data-open handler from firing directly
    requireVerifiedThen(() => open('m-list'));
  }, true); // capture, so this runs before the page's existing delegated click handler
});

/* Submit the ad to the real backend once the existing client-side validation passes.
   This runs in addition to (not instead of) your existing $('lf') submit handler:
   call this from the end of that handler, right after the WhatsApp notify line. */
async function submitAdToBackend(payload) {
  try {
    await otcApi('/ads', { method: 'POST', body: payload });
    toast('Listing submitted — pending admin approval.');
  } catch (err) {
    if (err.code === 'ACCOUNT_NOT_VERIFIED') {
      pendingAfterVerify = () => submitAdToBackend(payload);
      openModal('m-otp');
    } else {
      toast(err.message);
    }
  }
}

/* ---------------- Init ---------------- */
(async function initAuth() { await loadMe(); renderAuthPanel(); })();
</script>
