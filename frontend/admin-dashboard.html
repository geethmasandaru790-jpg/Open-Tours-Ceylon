     Master Admin Dashboard for tharushageethma@gmail.com
     Same visual language as the main site: dark slate/amber/emerald,
     Playfair Display + Inter + Noto Sans Sinhala, .field/.box/.ov/.vpill.
     ============================================================ -->
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>OPEN TOURS CEYLON | Admin Dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M30 8l7 6 3 10-2 9 4 8-6 13-9 4-6-10 2-14-3-9 5-11z' fill='%23fbbf24'/%3E%3Ccircle cx='31' cy='30' r='3' fill='%230f172a'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],display:['Playfair Display','serif']}}}}</script>
<style>
body{background:#0f172a}
.glass{background:rgba(15,23,42,.88);backdrop-filter:blur(12px)}
.field{width:100%;background:#0f172a;border:1px solid #334155;border-radius:.6rem;padding:.55rem .8rem;color:#fff;font-size:.9rem;outline:none}
.field:focus{border-color:#fbbf24}
.card{background:#1e293b;border:1px solid #334155;border-radius:1rem;padding:1.25rem}
.vpill{padding:.2rem .6rem;border-radius:9999px;font-size:11px;font-weight:700}
.tab{padding:.55rem 1rem;border-radius:.6rem;font-size:.85rem;font-weight:600;color:#94a3b8;border:1px solid transparent}
.tab.on{color:#fbbf24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
table{width:100%;font-size:.85rem;border-collapse:collapse}
th{text-align:left;color:#94a3b8;font-weight:600;padding:.6rem;border-bottom:1px solid #334155;white-space:nowrap}
td{padding:.6rem;border-bottom:1px solid #1e293b;vertical-align:top}
tr:hover td{background:rgba(255,255,255,.02)}
.btn{padding:.4rem .9rem;border-radius:.5rem;font-size:.78rem;font-weight:700}
.btn-green{background:#16a34a;color:#fff}.btn-green:hover{background:#22c55e}
.btn-red{background:#dc2626;color:#fff}.btn-red:hover{background:#ef4444}
.btn-outline{border:1px solid #475569;color:#e2e8f0}.btn-outline:hover{border-color:#fbbf24;color:#fbbf24}
</style>
</head>
<body class="text-slate-300 font-sans antialiased">

<header class="sticky top-0 z-40 glass border-b border-slate-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <span class="font-display font-extrabold text-white text-lg"><i class="fa-solid fa-compass text-amber-400"></i> OPEN TOURS <span class="text-amber-400">CEYLON</span> <span class="ml-2 text-xs font-semibold text-slate-400">/ Admin</span></span>
    <div class="flex items-center gap-3">
      <span id="whoAmI" class="text-sm text-slate-400"></span>
      <button id="signOutBtn" class="btn btn-outline">Sign Out</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
  <div id="gate" class="card text-center py-16 hidden">
    <i class="fa-solid fa-lock text-amber-400 text-3xl mb-4"></i>
    <h1 class="text-xl font-bold text-white mb-2">Admin Access Required</h1>
    <p class="text-slate-400 mb-6">Sign in with the master admin account to view this dashboard.</p>
    <a href="index.html" class="btn btn-outline inline-block">Back to Site</a>
  </div>

  <div id="dash" class="hidden">
    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-8" id="statCards"></div>

    <div class="flex gap-2 mb-6">
      <button class="tab on" data-tab="ads">Ads</button>
      <button class="tab" data-tab="users">Users</button>
    </div>

    <section id="tabAds" class="card">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 class="text-lg font-bold text-white">Ad Listings</h2>
        <div class="flex gap-2 items-center">
          <input id="adSearch" class="field" placeholder="Search title, owner, destination..." style="width:16rem">
          <select id="adStatusFilter" class="field" style="width:9rem">
            <option value="">All statuses</option>
            <option value="pending_approval">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </div>
      <div class="overflow-x-auto"><table id="adsTable"><thead>
        <tr><th>Title</th><th>Destination</th><th>Owner</th><th>Price</th><th>Status</th><th>Submitted</th><th>Actions</th></tr>
      </thead><tbody id="adsBody"></tbody></table></div>
      <p id="adsEmpty" class="hidden text-sm text-slate-500 py-6 text-center">No ads match your filters.</p>
    </section>

    <section id="tabUsers" class="card hidden">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 class="text-lg font-bold text-white">Users</h2>
        <div class="flex gap-2 items-center">
          <input id="userSearch" class="field" placeholder="Search name or email..." style="width:16rem">
          <select id="roleFilter" class="field" style="width:9rem">
            <option value="">All roles</option>
            <option value="tourist">Tourist</option>
            <option value="driver">Driver</option>
            <option value="guide">Guide</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>
      <div class="overflow-x-auto"><table id="usersTable"><thead>
        <tr><th>Name</th><th>Email</th><th>Role</th><th>Verified</th><th>Status</th><th>Joined</th><th>Actions</th></tr>
      </thead><tbody id="usersBody"></tbody></table></div>
      <p id="usersEmpty" class="hidden text-sm text-slate-500 py-6 text-center">No users match your filters.</p>
    </section>
  </div>
</main>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] hidden px-5 py-3 rounded-full bg-slate-800 border border-amber-400/50 text-sm text-white shadow-2xl"></div>

<script>
const OTC_API = window.OTC_API_BASE || 'http://localhost:4000/api';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get token() { return localStorage.getItem('otc_token'); }, set token(v) { v ? localStorage.setItem('otc_token', v) : localStorage.removeItem('otc_token'); } };

function toast(m) { const e = $('toast'); e.textContent = m; e.classList.remove('hidden'); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.add('hidden'), 4000); }
function showAlert(msg, kind = 'error') {
  const el = $('alertBox');
  el.textContent = msg;
  el.className = 'mb-4 p-3 rounded-lg text-sm ' + (kind === 'error' ? 'bg-red-500/15 text-red-300 border border-red-500/30' : 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30');
}

async function api(path, { method = 'GET', body } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (store.token) headers.Authorization = `Bearer ${store.token}`;
  const res = await fetch(`${OTC_API}${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

let me = null, allAds = [], allUsers = [];

function statusTag(status) {
  const map = {
    pending_approval: ['bg-amber-500/15 text-amber-300 border border-amber-500/40', 'Pending'],
    approved: ['bg-emerald-500/15 text-emerald-300 border border-emerald-500/40', 'Approved'],
    rejected: ['bg-red-500/15 text-red-300 border border-red-500/40', 'Rejected'],
  };
  const [cls, label] = map[status] || ['bg-slate-700/40 text-slate-400 border border-slate-600', status];
  return `<span class="vpill ${cls}">${label}</span>`;
}
function userStatusTag(status) {
  const map = {
    active: ['bg-emerald-500/15 text-emerald-300 border border-emerald-500/40', 'Active'],
    pending: ['bg-amber-500/15 text-amber-300 border border-amber-500/40', 'Pending'],
    suspended: ['bg-red-500/15 text-red-300 border border-red-500/40', 'Suspended'],
  };
  const [cls, label] = map[status] || ['bg-slate-700/40 text-slate-400 border border-slate-600', status];
  return `<span class="vpill ${cls}">${label}</span>`;
}
function dt(d) { return d ? new Date(d).toLocaleDateString() : '–'; }

/* ---------- Stats ---------- */
async function loadStats() {
  const s = await api('/admin/stats');
  $('statCards').innerHTML = [
    ['Total Users', s.totalUsers, 'fa-users'],
    ['Pending Ads', s.pendingAds, 'fa-hourglass-half'],
    ['Approved Drivers', s.activeDrivers, 'fa-van-shuttle'],
    ['Approved Guides', s.activeGuides, 'fa-map'],
  ].map(([label, val, icon]) => `
    <div class="card text-center">
      <i class="fa-solid ${icon} text-amber-400 mb-1"></i>
      <p class="text-2xl font-bold text-white">${val}</p>
      <p class="text-xs text-slate-400">${label}</p>
    </div>`).join('');
}

/* ---------- Ads tab ---------- */
async function loadAds() {
  const { ads } = await api('/admin/ads');
  allAds = ads;
  renderAds();
}
function renderAds() {
  const q = $('adSearch').value.trim().toLowerCase();
  const statusF = $('adStatusFilter').value;
  const list = allAds.filter(a =>
    (!statusF || a.status === statusF) &&
    (!q || [a.title, a.destination, a.ownerId?.name, a.ownerId?.email].join(' ').toLowerCase().includes(q))
  );
  $('adsBody').innerHTML = list.map(a => `
    <tr>
      <td class="text-white font-medium">${esc(a.title)}</td>
      <td>${esc(a.destination)}</td>
      <td>${esc(a.ownerId?.name || '–')}<br><span class="text-xs text-slate-500">${esc(a.ownerId?.role || '')}</span></td>
      <td>$${esc(a.price)}</td>
      <td>${statusTag(a.status)}</td>
      <td class="text-slate-500">${dt(a.createdAt)}</td>
      <td class="flex gap-2 flex-wrap">
        ${a.status !== 'approved' ? `<button class="btn btn-green" data-approve="${a._id}">Approve</button>` : ''}
        ${a.status !== 'rejected' ? `<button class="btn btn-red" data-reject="${a._id}">Reject</button>` : ''}
      </td>
    </tr>`).join('');
  $('adsEmpty').classList.toggle('hidden', list.length > 0);
}
$('adSearch').addEventListener('input', renderAds);
$('adStatusFilter').addEventListener('change', renderAds);
$('adsBody').addEventListener('click', async e => {
  const approveId = e.target.closest('[data-approve]')?.dataset.approve;
  const rejectId = e.target.closest('[data-reject]')?.dataset.reject;
  try {
    if (approveId) { await api(`/admin/ads/${approveId}/approve`, { method: 'PATCH' }); toast('Ad approved.'); }
    if (rejectId) {
      const reason = prompt('Reason for rejection (optional):') || '';
      await api(`/admin/ads/${rejectId}/reject`, { method: 'PATCH', body: { reason } });
      toast('Ad rejected.');
    }
    await Promise.all([loadAds(), loadStats()]);
  } catch (err) { showAlert(err.message); }
});

/* ---------- Users tab ---------- */
async function loadUsers() {
  const { users } = await api('/admin/users');
  allUsers = users;
  renderUsers();
}
function renderUsers() {
  const q = $('userSearch').value.trim().toLowerCase();
  const roleF = $('roleFilter').value;
  const list = allUsers.filter(u =>
    (!roleF || u.role === roleF) &&
    (!q || [u.name, u.email].join(' ').toLowerCase().includes(q))
  );
  $('usersBody').innerHTML = list.map(u => `
    <tr>
      <td class="text-white font-medium">${esc(u.name)}${u.isMasterAdmin ? ' <span class="vpill bg-amber-500/15 text-amber-300 border border-amber-500/40">Master Admin</span>' : ''}</td>
      <td>${esc(u.email)}</td>
      <td class="capitalize">${esc(u.role)}</td>
      <td>${u.isAccountVerified ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' : '<i class="fa-solid fa-circle-xmark text-slate-500"></i>'}</td>
      <td>${userStatusTag(u.status)}</td>
      <td class="text-slate-500">${dt(u.createdAt)}</td>
      <td>
        ${u.isMasterAdmin ? '<span class="text-xs text-slate-500">—</span>' :
          u.status !== 'suspended'
            ? `<button class="btn btn-red" data-suspend="${u._id}">Suspend</button>`
            : `<button class="btn btn-green" data-reactivate="${u._id}">Reactivate</button>`}
      </td>
    </tr>`).join('');
  $('usersEmpty').classList.toggle('hidden', list.length > 0);
}
$('userSearch').addEventListener('input', renderUsers);
$('roleFilter').addEventListener('change', renderUsers);
$('usersBody').addEventListener('click', async e => {
  const suspendId = e.target.closest('[data-suspend]')?.dataset.suspend;
  const reactivateId = e.target.closest('[data-reactivate]')?.dataset.reactivate;
  try {
    if (suspendId) { await api(`/admin/users/${suspendId}/suspend`, { method: 'PATCH' }); toast('User suspended.'); }
    if (reactivateId) { await api(`/admin/users/${reactivateId}/reactivate`, { method: 'PATCH' }); toast('User reactivated.'); }
    await Promise.all([loadUsers(), loadStats()]);
  } catch (err) { showAlert(err.message); }
});

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  tab.classList.add('on');
  $('tabAds').classList.toggle('hidden', tab.dataset.tab !== 'ads');
  $('tabUsers').classList.toggle('hidden', tab.dataset.tab !== 'users');
}));

/* ---------- Sign out ---------- */
$('signOutBtn').onclick = () => { store.token = null; window.location.href = 'index.html'; };

/* ---------- Init / gate ---------- */
(async function init() {
  if (!store.token) return showGate();
  try {
    const { user } = await api('/auth/me');
    if (!user.isMasterAdmin) return showGate();
    me = user;
    $('whoAmI').textContent = me.name;
    $('dash').classList.remove('hidden');
    await Promise.all([loadStats(), loadAds(), loadUsers()]);
  } catch (err) {
    showGate();
  }
})();
function showGate() { $('gate').classList.remove('hidden'); $('dash').classList.add('hidden'); }
</script>
</body>
</html>
