const VIDEOS=[
  {label:'Wildlife',   src:'https://assets.mixkit.co/videos/4611/4611-720.mp4', poster:'https://images.unsplash.com/photo-1547721064-da6cfb341d50?auto=format&fit=crop&w=1920&q=80'},

const HERO_SECONDS=9; // seconds each clip plays before crossfading to the next
(function heroPlaylist(){
  const bg=$('heroBg'),dots=$('heroDots');
  let slots=[]; // two stacked <img>/<video> pairs per index for crossfade
  VIDEOS.forEach((v,i)=>{
    const wrap=document.createElement('div');
    wrap.className='absolute inset-0 w-full h-full';
    const img=document.createElement('img');
    img.src=v.poster;img.alt='';img.className='heroMedia kb'+(i===0?' show':'');
    img.onerror=()=>{img.style.display='none'};
    wrap.appendChild(img);
    let vid=null;
    if(v.src){
      vid=document.createElement('video');
      vid.muted=true;vid.loop=true;vid.autoplay=true;vid.playsInline=true;vid.preload='none';
      vid.className='heroMedia'+(i===0?' show':'');
      vid.setAttribute('aria-hidden','true');
      vid.poster=v.poster;
      const src=document.createElement('source');src.src=v.src;src.type='video/mp4';vid.appendChild(src);
      vid.addEventListener('canplay',()=>{img.style.opacity='0'});
      vid.addEventListener('error',()=>{vid.style.display='none'}); // fall back silently to the poster image
      wrap.appendChild(vid);
    }
    bg.appendChild(wrap);
    slots.push({wrap,img,vid});
    const dot=document.createElement('button');
    dot.className='heroDot'+(i===0?' on':'');dot.setAttribute('aria-label',v.label);
    dot.onclick=()=>goTo(i);
    dots.appendChild(dot);
  });
  let cur=0,timer=null;
  function goTo(i){
    if(i===cur)return;
    slots[cur].img.classList.remove('show');if(slots[cur].vid){slots[cur].vid.classList.remove('show');try{slots[cur].vid.pause()}catch(_){}}
    cur=i;
    const s=slots[cur];
    s.img.classList.add('show');
    if(s.vid){s.vid.classList.add('show');s.vid.currentTime=0;s.vid.play().catch(()=>{});}
    [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===cur));
    restart();
  }
  function restart(){clearInterval(timer);timer=setInterval(()=>goTo((cur+1)%VIDEOS.length),HERO_SECONDS*1000)}
  if(slots[0].vid)slots[0].vid.play().catch(()=>{});
  restart();
})();

  <div class="relative h-32 sm:h-56 overflow-hidden bg-gradient-to-br from-slate-700 to-amber-900">
    <img data-main data-i0="0" src="${esc(x.photos[0])}" alt="${esc(x.title)}" loading="lazy" class="card-img w-full h-full object-cover cursor-zoom-in" onerror="this.style.display='none'">
    ${x.sponsored?`<span class="absolute top-2 left-2 bg-gradient-to-r from-amber-400 to-orange-500 text-slate-900 text-[10px] sm:text-xs font-bold px-2 sm:px-3 py-1 rounded-full"><i class="fa-solid fa-crown mr-1"></i>${t('feat')}</span>`:`<span class="absolute top-2 left-2 bg-amber-500 text-slate-900 text-[10px] sm:text-xs font-bold px-2 py-1 rounded-full">${esc(x.duration)}</span>`}
    <button data-fav class="absolute top-2 right-2 w-8 h-8 rounded-full bg-slate-900/70 ${fav?'text-red-400':'text-white'}" aria-label="Favourite"><i class="${fav?'fa-solid':'fa-regular'} fa-heart"></i></button>${th}
  </div>
  <div class="p-3 sm:p-5 flex flex-col flex-1">
    <h3 class="font-display text-sm sm:text-xl font-bold text-white leading-snug">${esc(x.title)}</h3>
    <p class="text-[11px] sm:text-xs text-amber-400 mt-1"><i class="fa-solid fa-location-dot mr-1"></i>${esc(x.dest)} · ${esc(x.operator)}</p>
    <p class="mt-1 text-xs text-slate-400 flex items-center gap-1 flex-wrap">${stars(a)} <span>${a?a.toFixed(1):'–'} (${x.reviews.length} ${t('reviews')})</span></p>
    <p class="hidden sm:block mt-3 text-sm text-slate-400">${esc(x.desc)}</p>
    <div class="hidden sm:flex flex-wrap gap-2 mt-3 flex-1 content-start">${chips}</div>
    <p class="mt-3 pt-3 border-t border-slate-700 text-lg sm:text-2xl font-bold text-amber-400">$${esc(x.price)} <span class="text-xs font-normal text-slate-400">${esc(x.unit)}</span></p>
    <a data-book href="${wa(`Hi, I want to book ${x.title} for $${x.price}`)}" target="_blank" rel="noopener" class="mt-3 flex items-center justify-center gap-2 bg-green-600 hover:bg-green-500 text-white text-xs sm:text-base font-semibold py-2.5 rounded-xl"><i class="fa-brands fa-whatsapp text-lg"></i>${t('book')}</a>
    <button data-rev class="mt-2 text-xs sm:text-sm text-slate-400 hover:text-amber-400"><i class="fa-regular fa-star mr-1"></i>${t('rate')}</button>
  </div></article>`}
function render(){
  const q=$('q').value.trim().toLowerCase(),d=$('fd').value,du=$('ft').value,dr=$('fr').value;
  const list=tours.filter(x=>(!d||x.dest===d)&&(!du||x.dur===du)&&(!dr||x.operator===dr)&&(!q||[x.title,x.dest,x.operator,x.desc].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>(b.sponsored?1:0)-(a.sponsored?1:0));
  $('grid').innerHTML=list.map(card).join('');$('cnt').textContent=list.length;$('none').classList.toggle('hidden',!!list.length)}
['q','fd','ft','fr'].forEach(id=>$(id).addEventListener('input',render));

$('grid').addEventListener('click',e=>{
  const c=e.target.closest('article');if(!c)return;const x=tours.find(v=>v.id==c.dataset.id);
  const th=e.target.closest('[data-thumb]'),m=c.querySelector('[data-main]');
  if(th){m.style.display='';m.src=x.photos[th.dataset.thumb];m.dataset.i0=th.dataset.thumb;c.querySelectorAll('[data-thumb]').forEach(b=>{b.classList.toggle('border-amber-400',b===th);b.classList.toggle('border-white/40',b!==th)});return}
  if(e.target.closest('[data-main]'))return lbOpen(x.photos,+m.dataset.i0);
  if(e.target.closest('[data-fav]')){favs=favs.includes(x.id)?favs.filter(i=>i!==x.id):[...favs,x.id];ls.set('favs',favs);return render()}
  if(e.target.closest('[data-rev]')){revId=x.id;stars0=0;$('rvT').textContent=x.title;pickStars();return open('m-rev')}
  if(e.target.closest('[data-book]')&&user){hist.unshift({title:x.title,price:x.price,at:new Date().toLocaleDateString()});ls.set('hist',hist)}});

/* ---------- Lightbox ---------- */
let lbL=[],lbI=0;
const lbShow=()=>{$('lbImg').src=lbL[lbI];$('lbP').style.display=$('lbN').style.display=lbL.length>1?'':'none'};
function lbOpen(l,i){lbL=l;lbI=i||0;lbShow();open('lb')}
function lbGo(n){lbI=(lbI+n+lbL.length)%lbL.length;lbShow()}
$('lbP').onclick=()=>lbGo(-1);$('lbN').onclick=()=>lbGo(1);

/* ---------- Reviews ---------- */
let revId=null,stars0=0;
function pickStars(){$('pick').innerHTML=[1,2,3,4,5].map(i=>`<button type="button" data-s="${i}" class="${i<=stars0?'text-amber-400':'text-slate-600'}" aria-label="${i} star"><i class="fa-solid fa-star"></i></button>`).join('')}
$('pick').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b){stars0=+b.dataset.s;pickStars()}});
$('vf').addEventListener('submit',e=>{e.preventDefault();if(!stars0)return toast('★');
  const x=tours.find(v=>v.id===revId),r={s:stars0,n:$('vName').value.trim()||'Guest',x:$('vTxt').value.trim()};
  x.reviews.push(r);const all=ls.get('rv',{});(all[x.id]=all[x.id]||[]).push(r);ls.set('rv',all);
  $('vf').reset();close('m-rev');render();toast(t('ok_rv'))});

/* ---------- Report a problem ---------- */
$('rf').addEventListener('submit',e=>{e.preventDefault();
  const m=`Tourist Report\nName: ${$('rName').value}\nContact: ${$('rCon').value}\nTour/Driver: ${$('rTour').value}\nProblem: ${$('rMsg').value}`;
  window.open(wa(m),'_blank','noopener');$('rf').reset();close('m-report')});

/* ---------- Optional tourist sign-in (demo: connect real OAuth, e.g. Firebase Auth, for production) ---------- */
function renderAuth(){
  $('authOut').classList.toggle('hidden',!!user);$('authIn').classList.toggle('hidden',!user);
  if(!user)return;$('who').textContent='✔ '+user.p;
  $('hist').innerHTML=hist.length?hist.map(h=>`<li>${esc(h.title)} · $${esc(h.price)} · ${esc(h.at)}</li>`).join(''):'<li>–</li>';
  $('favs').innerHTML=favs.length?favs.map(i=>`<li>${esc((tours.find(v=>v.id===i)||{}).title||'')}</li>`).join(''):'<li>–</li>'}
document.querySelectorAll('[data-prov]').forEach(b=>b.onclick=()=>{user={p:b.dataset.prov};ls.set('user',user);renderAuth()});
$('out').onclick=()=>{user=null;ls.set('user',null);renderAuth()};

/* ---------- Images + OCR ---------- */
const readURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej();r.readAsDataURL(f)});
const shrink=(u,max=1280,q=.82)=>new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.onerror=()=>res(null);i.src=u});
const fErr=m=>{$('fErr').textContent=m;$('fErr').classList.remove('hidden')};
let picked=[],pend=false;
const prev=()=>$('pv').innerHTML=picked.map((p,k)=>`<div class="w-16 h-16 rounded-lg overflow-hidden border-2 ${k?'border-slate-600':'border-amber-400'}"><img src="${esc(p)}" alt="" class="w-full h-full object-cover"></div>`).join('');
$('fPhotos').addEventListener('change',async()=>{
  $('fErr').classList.add('hidden');const all=[...$('fPhotos').files],fs=all.filter(f=>f.type.startsWith('image/')).slice(0,3);picked=[];prev();
  if(all.length>3)fErr('Max 3 photos. Only the first 3 were kept.');if(!fs.length)return;
  pend=true;try{picked=(await Promise.all(fs.map(async f=>shrink(await readURL(f))))).filter(Boolean)}catch(_){fErr('Could not read photos.')}pend=false;prev()});

let ocr={s:'idle',x:''},tok=0;
const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1');
function idSt(m,k){const e=$('idSt');e.className='mt-2 text-xs '+({info:'text-slate-400',ok:'text-green-400',err:'text-red-400'}[k]);e.textContent=m;e.classList.toggle('hidden',!m)}
$('fId').addEventListener('change',async()=>{
  $('fErr').classList.add('hidden');ocr={s:'idle',x:''};const f=$('fId').files[0],my=++tok;if(!f)return idSt('');
  if(!f.type.startsWith('image/')){ocr.s='err';return idSt('Please select an image file.','err')}
  ocr.s='scan';idSt('Scanning ID photo... this can take a few seconds.','info');
  try{if(typeof Tesseract==='undefined')throw 0;const sm=await shrink(await readURL(f),1800,.9);if(!sm)throw 0;
    const r=await Tesseract.recognize(sm,'eng');if(my!==tok)return;ocr={s:'done',x:norm(r.data.text||'')};idSt('ID photo scanned. Your number is checked on submit.','ok')}
  catch(_){if(my!==tok)return;ocr={s:'err',x:''};idSt('Could not scan the ID photo. Please upload a clearer image.','err')}});

/* ---------- Submit listing ---------- */
$('lf').addEventListener('submit',e=>{e.preventDefault();
  const v=id=>$(id).value.trim(),name=v('fName'),title=v('fTitle'),dest=v('fDest'),dur=v('fDur'),desc=v('fDesc'),lic=v('fLic'),w=v('fWa'),price=parseFloat(v('fPrice'));
  if(!name||!title||!dest||!dur||!desc||!lic||!w)return fErr('Please complete all required fields.');
  if(!(price>0))return fErr('Please enter a valid rate in USD.');
  if(pend)return fErr('Photos are still processing. Please wait.');
  if(!picked.length)return fErr('Please upload at least one tour photo (up to 3).');
  if(!$('fId').files.length)return fErr('Please upload a photo of your Driving License / NIC.');
  if(ocr.s==='scan')return fErr('Your ID photo is still being scanned. Please wait and try again.');
  if(ocr.s!=='done')return fErr('We could not scan your ID photo. Please upload a clearer image.');
  const n=norm(lic);if(n.length<6||!ocr.x.includes(n))return fErr('The number you entered was not found on the uploaded ID photo. Check the number or upload a clearer photo.');
  const dg=w.replace(/\D/g,'');if(dg.length<9||dg.length>15)return fErr('Please enter a valid WhatsApp number.');
  if(!$('fTerms').checked)return fErr('You must agree to the Driver Terms & Conditions (10% commission).');
  const parts=desc.split(/[,\n]/).map(s=>s.trim()).filter(s=>s&&s.length<=28).slice(0,4);
  const kind=/night|days|multi/i.test(dur)&&!/^1 day/i.test(dur)?'multi':/half|\b[1-5]\s*h/i.test(dur)?'half':'day';
  tours.unshift({id:nextId++,title,dest,operator:name,duration:dur,dur:kind,price,unit:'per day / package',photos:picked.slice(),includes:parts.length>=2?parts:['Driver-guide','Vehicle','Custom itinerary'],desc:desc.length>160?desc.slice(0,157)+'...':desc,reviews:[]});
  const msg=['New Driver Listing Submitted for Approval',`Driver/Company: ${name}`,`Tour: ${title} (${dest})`,`Rate: $${price} USD`,`Duration: ${dur}`,`Photos: ${picked.length}`,`Description: ${desc.slice(0,400)}`,`Driving License / NIC (OCR-verified, internal): ${lic}`,`Driver WhatsApp (internal): ${w}`,'Driver Terms & 10% commission: ACCEPTED'].join('\n');
  $('lf').reset();picked=[];prev();ocr={s:'idle',x:''};tok++;idSt('');close('m-list');fillFilters();render();
  $('tours').scrollIntoView({behavior:'smooth'});toast(t('ok_list'));window.open(wa(msg),'_blank','noopener')});

/* ---------- Language switcher ---------- */
function applyLang(){
  document.documentElement.lang=L==='si'?'si':'en';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
  fillFilters();render()}
$('langBtn').onclick=()=>{document.body.classList.add('sw');setTimeout(()=>{L=L==='en'?'si':'en';ls.set('lang',L);applyLang();document.body.classList.remove('sw')},180)};

/* ---------- Init ---------- */
const gm='Hi Open Tours Ceylon, I have a question about your tours.';
$('navWa').href=wa(gm);$('footWa').href=wa(gm);$('yr').textContent=new Date().getFullYear();
applyLang();
</script>
</body>
</html>
